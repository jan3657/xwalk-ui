[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xwalk-ui"
version = "0.1.0"
description = "Browser workbench and demonstration sites for xwalk"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["xwalk-match @ git+https://github.com/jan3657/xwalk.git@62b8d592515ade0d59c39462eca4f079954b7856"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "cryptography>=42", "hatchling"]
chatgpt = ["xwalk-match[chatgpt] @ git+https://github.com/jan3657/xwalk.git@62b8d592515ade0d59c39462eca4f079954b7856"]
dense = ["xwalk-match[dense] @ git+https://github.com/jan3657/xwalk.git@62b8d592515ade0d59c39462eca4f079954b7856"]

[project.scripts]
xwalk-ui = "xwalk_ui.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xwalk_ui"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", "web/node_modules", "ner-site/indexes", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ner-site"]
asyncio_mode = "auto"
markers = ["chatgpt: optional OAuth dependencies", "dense: optional dense dependencies", "integration: external providers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
